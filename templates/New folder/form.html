{% extends "base.html" %}
{% block content %}
<div class="min-h-screen py-12 flex items-center justify-center px-6">
    <div class="max-w-2xl w-full glass p-10 rounded-[2.5rem] shadow-2xl">
        
        <!-- Progress Bar -->
        <div class="flex gap-2 mb-10">
            <div id="p1" class="h-1.5 flex-1 bg-indigo-600 rounded-full"></div>
            <div id="p2" class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
            <div id="p3" class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
            <div id="p4" class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
        </div>

        <!-- Step 1: Personal & Demographics -->
        <div id="step1" class="space-y-6">
            <h2 class="text-3xl font-bold">Demographics</h2>
            <div class="grid grid-cols-2 gap-4">
                <input id="age" type="number" placeholder="Age" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500">
                <select id="gender" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                    <option>Male</option><option>Female</option><option>Other</option>
                </select>
            </div>
            <select id="location" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
                <option>Gauteng</option>
                <option>Western Cape</option>
                <option>KwaZulu-Natal</option>
                <option>Eastern Cape</option>
                <option>Free State</option>
                <option>Limpopo</option>
                <option>Mpumalanga</option>
                <option>North West</option>
                <option>Northern Cape</option>
            </select>
            <button onclick="showStep(2)" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold">Continue</button>
        </div>

        <!-- Step 2: Education Depth -->
        <div id="step2" class="hidden space-y-6">
            <h2 class="text-3xl font-bold">Education</h2>
            <input id="title" type="text" placeholder="Qualification Title (e.g. B.Sc Computer Science)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <div class="grid grid-cols-2 gap-4">
                <select id="nqf" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none text-sm">
                    <option value="5">NQF Level 5 (Higher Cert)</option>
                    <option value="6">NQF Level 6 (Diploma)</option>
                    <option value="7" selected>NQF Level 7 (Degree)</option>
                    <option value="8">NQF Level 8 (Honours)</option>
                    <option value="9">NQF Level 9 (Masters)</option>
                    <option value="10">NQF Level 10 (PhD)</option>
                </select>
                <input id="field" type="text" placeholder="Field of Study" class="bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            </div>
            <textarea id="concepts" placeholder="Core Concepts Covered (e.g. SDLC, Financial Modeling, Thermodynamics)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-24 outline-none"></textarea>
            <div class="flex gap-4">
                <button onclick="showStep(1)" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold">Back</button>
                <button onclick="showStep(3)" class="flex-[2] py-4 bg-indigo-600 rounded-2xl font-bold">Continue</button>
            </div>
        </div>

        <!-- Step 3: Technical & Certs -->
        <div id="step3" class="hidden space-y-6">
            <h2 class="text-3xl font-bold">Skills & Certifications</h2>
            <textarea id="tech" placeholder="Technologies Used (e.g. Python, AWS, SAP, AutoCAD)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-24 outline-none"></textarea>
            <textarea id="certs" placeholder="Certifications (e.g. AWS Cloud Practitioner, CFA Level 1, Prince2)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl h-24 outline-none"></textarea>
            <div class="flex gap-4">
                <button onclick="showStep(2)" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold">Back</button>
                <button onclick="showStep(4)" class="flex-[2] py-4 bg-indigo-600 rounded-2xl font-bold">Continue</button>
            </div>
        </div>

        <!-- Step 4: Experience -->
        <div id="step4" class="hidden space-y-6">
            <h2 class="text-3xl font-bold">Professional Experience</h2>
            <input id="exp" type="number" placeholder="Years of Experience" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <input id="industry" type="text" placeholder="Primary Industry (e.g. Banking, Mining, Tech)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <div class="flex gap-4">
                <button onclick="showStep(3)" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold">Back</button>
                <button onclick="submitForm()" id="submitBtn" class="flex-[2] py-4 bg-gradient-to-r from-indigo-600 to-cyan-500 rounded-2xl font-bold">Run Deep Analysis</button>
            </div>
        </div>
    </div>
</div>

<script>
    function showStep(s) {
        for(let i=1; i<=4; i++) {
            document.getElementById('step'+i).classList.toggle('hidden', i !== s);
            document.getElementById('p'+i).classList.toggle('bg-indigo-600', i <= s);
            document.getElementById('p'+i).classList.toggle('bg-white/10', i > s);
        }
    }

    async function submitForm() {
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        
        // Basic Validation
        if (!document.getElementById('title').value || !document.getElementById('tech').value) {
            alert("Please fill in your Qualification Title and Technologies used.");
            return;
        }

        btn.innerText = "Consulting AI Labor Markets...";
        btn.disabled = true;

        const data = {
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            location: document.getElementById('location').value,
            title: document.getElementById('title').value,
            nqf: document.getElementById('nqf').value,
            field: document.getElementById('field').value,
            concepts: document.getElementById('concepts').value,
            tech: document.getElementById('tech').value,
            certs: document.getElementById('certs').value,
            exp: document.getElementById('exp').value,
            industry: document.getElementById('industry').value
        };

        try {
            const res = await fetch('/api/process', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (!res.ok) {
                const errorData = await res.json();
                throw new Error(errorData.error || `Server Error (${res.status})`);
            }

            const result = await res.json();
            
            // Verify we actually got data back
            if (!result || Object.keys(result).length === 0) {
                throw new Error("AI returned an empty response. Please try again.");
            }

            localStorage.setItem('employ_data', JSON.stringify(result));
            window.location.href = '/dashboard';

        } catch (err) {
            console.error("Submission Error:", err);
            alert("Analysis Failed: " + err.message + "\n\nCheck your Python terminal for more details.");
            
            // Reset button so user can try again
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
